<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Holzland Maradonas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  margin: 0;
  background: #0f0f0f;
  color: white;
}

/* ================= HEADER FIX ================= */
header {
  padding: 20px 40px;
  background: linear-gradient(135deg, #0a0a0a, #1c1c1c);
  border-bottom: 1px solid #2a2a2a;
  text-align: left !important;
}

.header-inner {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 20px;
}

/* LOGO LINKS + GROSS */
.logo-img {
  height: 120px !important;
  width: auto;
  object-fit: contain;
  display: block;
}

/* TEXT */
.header-text {
  display: flex;
  flex-direction: column;
}

.logo {
  font-size: 36px;
  font-weight: 700;
  letter-spacing: 2px;
}

.sub {
  font-size: 13px;
  color: #aaa;
}

/* ================= SHOP ================= */

.container {
  padding: 25px;
  max-width: 1200px;
  margin: auto;
}

input, select {
  padding: 12px;
  margin: 6px;
  border-radius: 10px;
  border: none;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 25px;
  margin-top: 25px;
}

.product {
  background: #151515;
  padding: 12px;
  border-radius: 18px;
  text-align: center;
  border: 1px solid #222;
  transition: 0.25s;
}

.product:hover {
  transform: translateY(-6px);
  border-color: #00c853;
}

.product img {
  width: 100%;
  border-radius: 14px;
}

button {
  background: linear-gradient(135deg, #00c853, #00a844);
  border: none;
  color: white;
  padding: 10px 14px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 600;
  margin-top: 8px;
}

#cart {
  margin-top: 30px;
  background: #151515;
  padding: 15px;
  border-radius: 18px;
  border: 1px solid #222;
}

.qty-btn {
  background: #333;
  border: none;
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
}

.small-btn {
  background: red;
  border: none;
  color: white;
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
}
</style>

</head>

<body>

<!-- ================= HEADER ================= -->
<header>
  <div class="header-inner">

    <img src="bilder/logo.jpg"
         class="logo-img"
         alt="Logo"
         onerror="this.style.display='none'">

    <div class="header-text">
      <div class="logo">Holzland Maradonas</div>
      <div class="sub">Podcast Merch</div>
    </div>

  </div>
</header>

<!-- ================= SHOP ================= -->
<div class="container">

<input id="name" placeholder="Dein Name">

<select id="size">
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
</select>

<div class="products" id="products"></div>

<div id="cart">
<h2>🛒 Warenkorb</h2>
<ul id="cartList"></ul>
<h3 id="total">Gesamt: 0 €</h3>
<button onclick="bestellen()">Bestellen</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCoLq0oP8U8Ag1qXHl_pr7oixDrAy7r8gQ",
  authDomain: "onlineshop-maradonas.firebaseapp.com",
  projectId: "onlineshop-maradonas",
  storageBucket: "onlineshop-maradonas.firebasestorage.app",
  messagingSenderId: "491142033512",
  appId: "1:491142033512:web:f79e5db730349e9471cbdd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ================= PRODUKTE =================
const products = [
  {name:"Hoodie Rot", price:30, img:"bilder/hoodie_rot.png"},
  {name:"Hoodie Weinrot", price:30, img:"bilder/hoodie_weinrot.jpg"},
  {name:"Hoodie Grün", price:30, img:"bilder/hoodie_gruen.png"},
  {name:"Hoodie Schwarz", price:30, img:"bilder/hoodie_schwarz.png"},

  {name:"Pulli Rot", price:25, img:"bilder/pulli_rot.png"},
  {name:"Pulli Weinrot", price:25, img:"bilder/pulli_weinrot.png"},
  {name:"Pulli Grün", price:25, img:"bilder/pulli_gruen.png"},
  {name:"Pulli Schwarz", price:25, img:"bilder/pulli_schwarz.png"},

  {name:"T-Shirt Rot", price:20, img:"bilder/tshirt_rot.png"},
  {name:"T-Shirt Weinrot", price:20, img:"bilder/tshirt_weinrot.png"},
  {name:"T-Shirt Grün", price:20, img:"bilder/tshirt_gruen.png"},
  {name:"T-Shirt Schwarz", price:20, img:"bilder/tshirt_schwarz.png"},

  {name:"Polo Rot", price:20, img:"bilder/polo_rot.png"},
  {name:"Polo Grün", price:20, img:"bilder/polo_gruen.png"},
  {name:"Polo Schwarz", price:20, img:"bilder/polo_schwarz.png"},

  {name:"Mütze Weinrot", price:10, img:"bilder/muetze_weinrot.png"},
  {name:"Mütze Grün", price:10, img:"bilder/muetze_gruen.png"},
  {name:"Mütze Schwarz", price:10, img:"bilder/muetze_schwarz.png"}
];

let cart = [];

// ================= PRODUCTS =================
function displayProducts() {
  const container = document.getElementById("products");
  container.innerHTML = "";

  products.forEach(p => {
    const div = document.createElement("div");
    div.className = "product";

    div.innerHTML = `
      <img src="${p.img}" onerror="this.style.display='none'">
      <p><b>${p.name}</b></p>
      <p>${p.price} €</p>
      <button onclick="addToCart('${p.name}', ${p.price})">Hinzufügen</button>
    `;

    container.appendChild(div);
  });
}

// ================= CART =================
window.addToCart = function(name, price) {
  const size = document.getElementById("size").value;

  const existing = cart.find(i => i.name === name && i.size === size);

  if (existing) existing.qty++;
  else cart.push({ name, size, price, qty: 1 });

  updateCart();
}

window.changeQty = function(index, value) {
  cart[index].qty += value;
  if (cart[index].qty <= 0) cart.splice(index, 1);
  updateCart();
}

window.removeItem = function(index) {
  cart.splice(index, 1);
  updateCart();
}

function updateCart() {
  const list = document.getElementById("cartList");
  list.innerHTML = "";

  let total = 0;

  cart.forEach((i, index) => {
    total += i.price * i.qty;

    const li = document.createElement("li");
    li.innerHTML = `
      ${i.name} (${i.size}) - ${i.price} € x ${i.qty}
      <button onclick="changeQty(${index}, -1)">-</button>
      <button onclick="changeQty(${index}, 1)">+</button>
      <button onclick="removeItem(${index})">❌</button>
    `;

    list.appendChild(li);
  });

  document.getElementById("total").textContent = "Gesamt: " + total + " €";
}

// ================= ORDER =================
window.bestellen = async function() {
  const name = document.getElementById("name").value;

  if (!name || cart.length === 0) return alert("Fehler!");

  await addDoc(collection(db, "orders"), {
    name,
    cart,
    time: serverTimestamp()
  });

  alert("Bestellung gespeichert!");

  cart = [];
  updateCart();
}

displayProducts();

</script>

</body>
</html>
