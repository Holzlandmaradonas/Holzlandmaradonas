<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Holzland Maradonas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: radial-gradient(circle at top, #1a1a1a, #0a0a0a);
  color: white;
}

/* ================= HEADER ================= */
header {
  padding: 20px 40px;
  background: rgba(20,20,20,0.7);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.header-inner {
  display: flex;
  align-items: center;
  gap: 18px;
}

.logo-img {
  height: 110px;
  width: auto;
  object-fit: contain;
}

.header-text {
  display: flex;
  flex-direction: column;
}

.logo {
  font-size: 38px;
  font-weight: 700;
  letter-spacing: 1px;
}

.sub {
  font-size: 13px;
  color: #aaa;
}

/* ================= LAYOUT ================= */
.container {
  padding: 30px;
  max-width: 1200px;
  margin: auto;
}

/* INPUT */
input, select {
  padding: 12px;
  border-radius: 10px;
  border: none;
  margin: 5px;
  background: #1c1c1c;
  color: white;
}

/* ================= PRODUCTS ================= */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 22px;
  margin-top: 25px;
}

.product {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 18px;
  padding: 14px;
  text-align: center;
  transition: 0.25s;
  backdrop-filter: blur(8px);
}

.product:hover {
  transform: translateY(-6px);
  border-color: #00c853;
}

.product img {
  width: 100%;
  border-radius: 14px;
  margin-bottom: 10px;
}

/* BUTTON */
button {
  background: linear-gradient(135deg, #00c853, #00a844);
  border: none;
  color: white;
  padding: 10px 14px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 600;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.05);
}

/* ================= CART ================= */
#cart {
  margin-top: 30px;
  background: rgba(255,255,255,0.05);
  padding: 18px;
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(8px);
}

li {
  margin-bottom: 8px;
}
</style>

</head>

<body>

<!-- HEADER -->
<header>
  <div class="header-inner">

    <img src="bilder/logo.jpg"
         class="logo-img"
         alt="Logo"
         onerror="this.style.display='none'">

    <div class="header-text">
      <div class="logo">Holzland Maradonas</div>
      <div class="sub">Dein Podcast Merch</div>
    </div>

  </div>
</header>

<!-- SHOP -->
<div class="container">

<input id="name" placeholder="Dein Name">

<select id="size">
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
</select>

<div class="products" id="products"></div>

<div id="cart">
<h2>🛒 Warenkorb</h2>
<ul id="cartList"></ul>
<h3 id="total">Gesamt: 0 €</h3>
<button onclick="bestellen()">Bestellen</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCoLq0oP8U8Ag1qXHl_pr7oixDrAy7r8gQ",
  authDomain: "onlineshop-maradonas.firebaseapp.com",
  projectId: "onlineshop-maradonas",
  storageBucket: "onlineshop-maradonas.firebasestorage.app",
  messagingSenderId: "491142033512",
  appId: "1:491142033512:web:f79e5db730349e9471cbdd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ================= PRODUCTS =================
const products = [
  {name:"Hoodie Rot", price:30, img:"bilder/hoodie_rot.png"},
  {name:"Hoodie Weinrot", price:30, img:"bilder/hoodie_weinrot.jpg"},
  {name:"Hoodie Grün", price:30, img:"bilder/hoodie_gruen.png"},
  {name:"Hoodie Schwarz", price:30, img:"bilder/hoodie_schwarz.png"},

  {name:"Pulli Rot", price:25, img:"bilder/pulli_rot.png"},
  {name:"Pulli Weinrot", price:25, img:"bilder/pulli_weinrot.png"},
  {name:"Pulli Grün", price:25, img:"bilder/pulli_gruen.png"},
  {name:"Pulli Schwarz", price:25, img:"bilder/pulli_schwarz.png"},

  {name:"T-Shirt Rot", price:20, img:"bilder/tshirt_rot.png"},
  {name:"T-Shirt Weinrot", price:20, img:"bilder/tshirt_weinrot.png"},
  {name:"T-Shirt Grün", price:20, img:"bilder/tshirt_gruen.png"},
  {name:"T-Shirt Schwarz", price:20, img:"bilder/tshirt_schwarz.png"},

  {name:"Polo Rot", price:20, img:"bilder/polo_rot.png"},
  {name:"Polo Grün", price:20, img:"bilder/polo_gruen.png"},
  {name:"Polo Schwarz", price:20, img:"bilder/polo_schwarz.png"},

  {name:"Mütze Weinrot", price:10, img:"bilder/muetze_weinrot.png"},
  {name:"Mütze Grün", price:10, img:"bilder/muetze_gruen.png"},
  {name:"Mütze Schwarz", price:10, img:"bilder/muetze_schwarz.png"}
];

let cart = [];

// ================= RENDER =================
function displayProducts() {
  const container = document.getElementById("products");
  container.innerHTML = "";

  products.forEach(p => {
    const div = document.createElement("div");
    div.className = "product";

    div.innerHTML = `
      <img src="${p.img}" onerror="this.style.display='none'">
      <h3>${p.name}</h3>
      <p>${p.price} €</p>
      <button onclick="addToCart('${p.name}', ${p.price})">In den Warenkorb</button>
    `;

    container.appendChild(div);
  });
}

// ================= CART =================
window.addToCart = function(name, price) {
  const size = document.getElementById("size").value;

  cart.push({ name, size, price, qty: 1 });
  updateCart();
}

function updateCart() {
  const list = document.getElementById("cartList");
  list.innerHTML = "";

  let total = 0;

  cart.forEach(i => {
    total += i.price;

    const li = document.createElement("li");
    li.textContent = `${i.name} (${i.size}) - ${i.price} €`;
    list.appendChild(li);
  });

  document.getElementById("total").textContent = "Gesamt: " + total + " €";
}

// ================= ORDER =================
window.bestellen = async function() {
  const name = document.getElementById("name").value;

  if (!name || cart.length === 0) return alert("Fehler!");

  await addDoc(collection(db, "orders"), {
    name,
    cart,
    time: serverTimestamp()
  });

  alert("Bestellung gespeichert!");

  cart = [];
  updateCart();
}

displayProducts();

</script>

</body>
</html>
