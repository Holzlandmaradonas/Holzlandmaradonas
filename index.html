<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Holzland Maradonas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  margin: 0;
  background: #0f0f0f;
  color: white;
}

header {
  padding: 35px 20px;
  text-align: center;
  font-size: 34px;
  font-weight: 700;
  background: linear-gradient(135deg, #1f1f1f, #000);
  letter-spacing: 2px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

.container {
  padding: 25px;
  max-width: 1200px;
  margin: auto;
}

input, select {
  padding: 12px;
  margin: 6px;
  border-radius: 8px;
  border: none;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 22px;
  margin-top: 20px;
}

.product {
  background: #1c1c1c;
  padding: 15px;
  border-radius: 16px;
  text-align: center;
  transition: 0.2s;
  box-shadow: 0 6px 18px rgba(0,0,0,0.3);
}

.product:hover {
  transform: translateY(-5px);
}

.product img {
  width: 100%;
  border-radius: 12px;
}

button {
  background: linear-gradient(135deg, #00c853, #00a844);
  border: none;
  color: white;
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  transition: 0.2s;
  margin-top: 8px;
}

button:hover {
  transform: scale(1.05);
}

#cart {
  margin-top: 30px;
  background: #1c1c1c;
  padding: 15px;
  border-radius: 16px;
}
</style>

</head>
<body>

<header>
  🪵 Holzland Maradonas
</header>

<div class="container">

<input id="name" placeholder="Dein Name">

<select id="size">
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
</select>

<div class="products" id="products"></div>

<div id="cart">
<h2>🛒 Warenkorb</h2>
<ul id="cartList"></ul>
<button onclick="bestellen()">Bestellen</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCoLq0oP8U8Ag1qXHl_pr7oixDrAy7r8gQ",
  authDomain: "onlineshop-maradonas.firebaseapp.com",
  projectId: "onlineshop-maradonas",
  storageBucket: "onlineshop-maradonas.firebasestorage.app",
  messagingSenderId: "491142033512",
  appId: "1:491142033512:web:f79e5db730349e9471cbdd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🧥 PRODUKTE MIT PREISEN
const products = [
  {name:"Hoodie Rot", price:30, img:"bilder/hoodie_rot.jpg"},
  {name:"Hoodie Weinrot", price:30, img:"bilder/hoodie_weinrot.jpg"},
  {name:"Hoodie Grün", price:30, img:"bilder/hoodie_gruen.jpg"},
  {name:"Hoodie Schwarz", price:30, img:"bilder/hoodie_schwarz.jpg"},

  {name:"Pulli Rot", price:30, img:"bilder/pulli_rot.jpg"},
  {name:"Pulli Weinrot", price:30, img:"bilder/pulli_weinrot.jpg"},
  {name:"Pulli Grün", price:30, img:"bilder/pulli_gruen.jpg"},
  {name:"Pulli Schwarz", price:30, img:"bilder/pulli_schwarz.jpg"},

  {name:"T-Shirt Rot", price:20, img:"bilder/tshirt_rot.jpg"},
  {name:"T-Shirt Weinrot", price:20, img:"bilder/tshirt_weinrot.jpg"},
  {name:"T-Shirt Grün", price:20, img:"bilder/tshirt_gruen.jpg"},
  {name:"T-Shirt Schwarz", price:20, img:"bilder/tshirt_schwarz.jpg"},

  {name:"Mütze Rot", price:10, img:"bilder/muetze_rot.jpg"},
  {name:"Mütze Weinrot", price:10, img:"bilder/muetze_weinrot.jpg"},
  {name:"Mütze Grün", price:10, img:"bilder/muetze_gruen.jpg"},
  {name:"Mütze Schwarz", price:10, img:"bilder/muetze_schwarz.jpg"}
];

let cart = [];

// 📦 Produkte anzeigen
function displayProducts() {
  const container = document.getElementById("products");

  products.forEach(p => {
    const div = document.createElement("div");
    div.className = "product";

    div.innerHTML = `
      <img src="${p.img}">
      <p><b>${p.name}</b></p>
      <p>${p.price} €</p>
      <button onclick="addToCart('${p.name}', ${p.price})">Hinzufügen</button>
    `;

    container.appendChild(div);
  });
}

// 🛒 Warenkorb
window.addToCart = function(name, price) {
  const size = document.getElementById("size").value;

  const item = name.includes("Mütze")
    ? { text: name + " (Einheitsgröße)", price }
    : { text: name + " (" + size + ")", price };

  cart.push(item);
  updateCart();
}

// 🔄 Warenkorb anzeigen
function updateCart() {
  const list = document.getElementById("cartList");
  list.innerHTML = "";

  cart.forEach(i => {
    const li = document.createElement("li");
    li.textContent = `${i.text} - ${i.price} €`;
    list.appendChild(li);
  });
}

// 📤 Bestellung speichern
window.bestellen = async function() {
  const name = document.getElementById("name").value;

  if (!name) {
    alert("Name fehlt!");
    return;
  }

  if (cart.length === 0) {
    alert("Warenkorb ist leer!");
    return;
  }

  await addDoc(collection(db, "orders"), {
    name: name,
    cart: cart,
    time: new Date()
  });

  alert("Bestellung gespeichert!");

  cart = [];
  updateCart();
}

// Start
displayProducts();

</script>

</body>
</html>
