<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Holzland Maradonas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: radial-gradient(circle at top, #1a1a1a, #0a0a0a);
  color: white;
}

/* HEADER */
header {
  padding: 20px 40px;
  background: rgba(20,20,20,0.7);
  backdrop-filter: blur(10px);
}

.header-inner {
  display: flex;
  align-items: center;
  gap: 20px;
}

.logo-img {
  height: 110px;
}

.logo {
  font-size: 36px;
  font-weight: 700;
}

.sub {
  font-size: 13px;
  color: #aaa;
}

/* CONTAINER */
.container {
  padding: 30px;
  max-width: 1200px;
  margin: auto;
}

/* 🔥 NAME GROSS */
#name {
  padding: 18px;
  font-size: 18px;
  width: 300px;
  border-radius: 12px;
  border: none;
  margin-bottom: 20px;
}

/* PRODUCTS */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 25px;
}

.product {
  background: rgba(255,255,255,0.05);
  border-radius: 18px;
  padding: 15px;
  text-align: center;
}

.product img {
  width: 100%;
  border-radius: 14px;
}

/* SELECT BEI PRODUKT */
.size-select {
  margin-top: 8px;
  padding: 8px;
  border-radius: 8px;
  border: none;
  background: #1c1c1c;
  color: white;
}

/* BUTTON */
button {
  background: linear-gradient(135deg, #00c853, #00a844);
  border: none;
  color: white;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
  cursor: pointer;
}

/* CART */
#cart {
  margin-top: 30px;
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 18px;
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <img src="bilder/logo.jpg" class="logo-img">
    <div>
      <div class="logo">Holzland Maradonas</div>
      <div class="sub">Streetwear & Drops</div>
    </div>
  </div>
</header>

<div class="container">

<input id="name" placeholder="Dein Name">

<div class="products" id="products"></div>

<div id="cart">
<h2>🛒 Warenkorb</h2>
<ul id="cartList"></ul>
<h3 id="total">Gesamt: 0 €</h3>
<button onclick="bestellen()">Bestellen</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIza...",
  authDomain: "onlineshop-maradonas.firebaseapp.com",
  projectId: "onlineshop-maradonas"
});

const db = getFirestore(app);

const products = [
  {name:"Hoodie Rot", price:30, img:"bilder/hoodie_rot.png"},
  {name:"Hoodie Weinrot", price:30, img:"bilder/hoodie_weinrot.jpg"},
  {name:"Hoodie Grün", price:30, img:"bilder/hoodie_gruen.png"},
  {name:"Hoodie Schwarz", price:30, img:"bilder/hoodie_schwarz.png"},

  {name:"Pulli Rot", price:25, img:"bilder/pulli_rot.png"},
  {name:"Pulli Weinrot", price:25, img:"bilder/pulli_weinrot.png"},
  {name:"Pulli Grün", price:25, img:"bilder/pulli_gruen.png"},
  {name:"Pulli Schwarz", price:25, img:"bilder/pulli_schwarz.png"}
];

let cart = [];

// PRODUKTE
function displayProducts() {
  const container = document.getElementById("products");
  container.innerHTML = "";

  products.forEach((p, index) => {
    const div = document.createElement("div");
    div.className = "product";

    div.innerHTML = `
      <img src="${p.img}">
      <h3>${p.name}</h3>
      <p>${p.price} €</p>

      <select class="size-select" id="size-${index}">
        <option>S</option>
        <option>M</option>
        <option>L</option>
        <option>XL</option>
        <option>XXL</option>
      </select>

      <button onclick="addToCart(${index})">Hinzufügen</button>
    `;

    container.appendChild(div);
  });
}

// ADD
window.addToCart = function(index) {
  const product = products[index];
  const size = document.getElementById(`size-${index}`).value;

  cart.push({
    name: product.name,
    size,
    price: product.price,
    qty: 1
  });

  updateCart();
}

// CART
function updateCart() {
  const list = document.getElementById("cartList");
  list.innerHTML = "";

  let total = 0;

  cart.forEach(i => {
    total += i.price;

    const li = document.createElement("li");
    li.textContent = `${i.name} (${i.size}) - ${i.price} €`;
    list.appendChild(li);
  });

  document.getElementById("total").textContent = "Gesamt: " + total + " €";
}

// BESTELLEN
window.bestellen = async function() {
  const name = document.getElementById("name").value;

  if (!name || cart.length === 0) return alert("Fehler!");

  await addDoc(collection(db, "orders"), {
    name,
    cart,
    time: serverTimestamp()
  });

  alert("Bestellung gespeichert!");

  cart = [];
  updateCart();
}

displayProducts();

</script>

</body>
</html>
