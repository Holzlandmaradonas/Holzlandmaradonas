<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Holzland Maradonas</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  margin: 0;
}

header {
  background: black;
  text-align: center;
  padding: 20px;
  font-size: 28px;
}

.container {
  padding: 20px;
  max-width: 1100px;
  margin: auto;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
}

.product {
  background: #1c1c1c;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}

button {
  background: #00c853;
  border: none;
  padding: 8px;
  color: white;
  border-radius: 8px;
  cursor: pointer;
  margin-top: 5px;
}

#cart {
  margin-top: 20px;
  background: #1c1c1c;
  padding: 15px;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>🪵 Holzland Maradonas</header>

<div class="container">

<input id="name" placeholder="Dein Name">

<select id="size">
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
</select>

<div class="products" id="products"></div>

<div id="cart">
<h2>🛒 Warenkorb</h2>
<ul id="cartList"></ul>
<h3 id="total">Gesamt: 0 €</h3>
<button onclick="bestellen()">Bestellen</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCoLq0oP8U8Ag1qXHl_pr7oixDrAy7r8gQ",
  authDomain: "onlineshop-maradonas.firebaseapp.com",
  projectId: "onlineshop-maradonas",
  storageBucket: "onlineshop-maradonas.firebasestorage.app",
  messagingSenderId: "491142033512",
  appId: "1:491142033512:web:f79e5db730349e9471cbdd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🧥 Produkte
const products = [
  {name:"Hoodie Rot", price:30},
  {name:"Pulli Rot", price:25},
  {name:"T-Shirt Rot", price:20},
  {name:"Polo Rot", price:20},
  {name:"Mütze Rot", price:10}
];

let cart = [];

// Produkte anzeigen
function display() {
  const div = document.getElementById("products");

  products.forEach(p => {
    const el = document.createElement("div");
    el.className = "product";

    el.innerHTML = `
      <p><b>${p.name}</b></p>
      <p>${p.price} €</p>
      <button onclick="add('${p.name}', ${p.price})">Hinzufügen</button>
    `;

    div.appendChild(el);
  });
}

window.add = function(name, price) {
  const size = document.getElementById("size").value;

  cart.push({ product: name, size, price });

  update();
}

function update() {
  const list = document.getElementById("cartList");
  list.innerHTML = "";

  let total = 0;

  cart.forEach(i => {
    total += i.price;
    const li = document.createElement("li");
    li.textContent = `${i.product} (${i.size}) - ${i.price} €`;
    list.appendChild(li);
  });

  document.getElementById("total").textContent = "Gesamt: " + total + " €";
}

window.bestellen = async function() {
  const name = document.getElementById("name").value;

  if (!name || cart.length === 0) return alert("Fehler!");

  await addDoc(collection(db, "orders"), {
    name,
    cart,
    time: new Date()
  });

  alert("Bestellung gesendet!");

  cart = [];
  update();
}

display();

</script>

</body>
</html>
