<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Holzland Maradonas</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: radial-gradient(circle at top, #1a1a1a, #0a0a0a);
  color: white;
}

header {
  padding: 20px 40px;
  background: rgba(20,20,20,0.8);
}

.header-inner {
  display: flex;
  align-items: center;
  gap: 20px;
}

.logo-img { height: 110px; }
.logo { font-size: 36px; font-weight: 700; }

.container {
  padding: 30px;
  max-width: 1200px;
  margin: auto;
}

/* NAME + INFO */
.name-row {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

#name {
  padding: 18px;
  font-size: 18px;
  width: 320px;
  border-radius: 12px;
  border: none;
}

.hint {
  color: #aaa;
  font-size: 14px;
}

/* PRODUCTS */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 25px;
}

.product {
  background: rgba(255,255,255,0.05);
  padding: 15px;
  border-radius: 18px;
  text-align: center;
}

/* SIZE BUTTONS */
.sizes {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 10px;
}

.size-btn {
  padding: 8px 10px;
  border-radius: 8px;
  border: 2px solid #444;
  cursor: pointer;
  font-weight: 600;
}

.size-btn.active {
  background: #00c853;
  border-color: #00c853;
}

.product img {
  width: 100%;
  border-radius: 14px;
}

/* BUTTON */
button {
  background: linear-gradient(135deg, #00c853, #00a844);
  border: none;
  color: white;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
  cursor: pointer;
}

.delete { background: red; }

/* CART */
#cart {
  margin-top: 30px;
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 18px;
}

.cart-item {
  margin-bottom: 10px;
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <img src="bilder/logo.jpg" class="logo-img">
    <div class="logo">Holzland Maradonas</div>
  </div>
</header>

<div class="container">

<div class="name-row">
  <input id="name" placeholder="Dein Name">
  <div class="hint">Alle Logos gestickt (bis auf Polos...)!</div>
</div>

<div class="products" id="products"></div>

<div id="cart">
<h2>🛒 Warenkorb</h2>
<div id="cartList"></div>
<h3 id="total">Gesamt: 0 €</h3>
<button onclick="bestellen()">Bestellen</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSy...",
  authDomain: "onlineshop-maradonas.firebaseapp.com",
  projectId: "onlineshop-maradonas"
});

const db = getFirestore(app);

const products = [
  {name:"Hoodie Rot", price:30, img:"bilder/hoodie_rot.png"},
  {name:"Hoodie Weinrot", price:30, img:"bilder/hoodie_weinrot.jpg"},
  {name:"Hoodie Grün", price:30, img:"bilder/hoodie_gruen.png"},
  {name:"Hoodie Schwarz", price:30, img:"bilder/hoodie_schwarz.png"},

  {name:"Pulli Rot", price:25, img:"bilder/pulli_rot.png"},
  {name:"Pulli Weinrot", price:25, img:"bilder/pulli_weinrot.png"},
  {name:"Pulli Grün", price:25, img:"bilder/pulli_gruen.png"},
  {name:"Pulli Schwarz", price:25, img:"bilder/pulli_schwarz.png"},

  {name:"T-Shirt Rot", price:20, img:"bilder/tshirt_rot.png"},
  {name:"T-Shirt Weinrot", price:20, img:"bilder/tshirt_weinrot.png"},
  {name:"T-Shirt Grün", price:20, img:"bilder/tshirt_gruen.png"},
  {name:"T-Shirt Schwarz", price:20, img:"bilder/tshirt_schwarz.png"},

  {name:"Polo Rot", price:20, img:"bilder/polo_rot.png"},
  {name:"Polo Grün", price:20, img:"bilder/polo_gruen.png"},
  {name:"Polo Schwarz", price:20, img:"bilder/polo_schwarz.png"},

  {name:"Mütze Weinrot", price:10, img:"bilder/muetze_weinrot.png"},
  {name:"Mütze Grün", price:10, img:"bilder/muetze_gruen.png"},
  {name:"Mütze Schwarz", price:10, img:"bilder/muetze_schwarz.png"}
];

let cart = [];
let selectedSizes = {};

// PRODUKTE
function displayProducts() {
  const container = document.getElementById("products");

  products.forEach((p, index) => {

    const isHat = p.name.includes("Mütze");

    let sizeHTML = "";

    if (!isHat) {
      sizeHTML = `
        <div class="sizes">
          ${["S","M","L","XL","XXL"].map(size =>
            `<div class="size-btn" onclick="selectSize(${index}, '${size}', this)">${size}</div>`
          ).join("")}
        </div>
      `;
    } else {
      sizeHTML = `<p>Einheitsgröße</p>`;
    }

    const div = document.createElement("div");
    div.className = "product";

    div.innerHTML = `
      <img src="${p.img}">
      <h3>${p.name}</h3>
      <p>${p.price} €</p>
      ${sizeHTML}
      <button onclick="addToCart(${index})">Hinzufügen</button>
    `;

    container.appendChild(div);
  });
}

// SIZE SELECT
window.selectSize = function(index, size, el) {
  selectedSizes[index] = size;

  const parent = el.parentElement;
  [...parent.children].forEach(btn => btn.classList.remove("active"));

  el.classList.add("active");
}

// ADD
window.addToCart = function(index) {
  const p = products[index];
  const isHat = p.name.includes("Mütze");

  const size = isHat ? "Einheitsgröße" : selectedSizes[index];

  if (!size) return alert("Bitte Größe wählen!");

  cart.push({ name:p.name, size, price:p.price, qty:1 });

  updateCart();
}

// CART
function updateCart() {
  const container = document.getElementById("cartList");
  container.innerHTML = "";

  let total = 0;

  cart.forEach((item, i) => {
    total += item.price * item.qty;

    container.innerHTML += `
      <div class="cart-item">
        ${item.name} (${item.size}) x${item.qty}
        <button onclick="changeQty(${i}, -1)">-</button>
        <button onclick="changeQty(${i}, 1)">+</button>
        <button class="delete" onclick="removeItem(${i})">❌</button>
      </div>
    `;
  });

  document.getElementById("total").textContent = "Gesamt: " + total + " €";
}

window.changeQty = (i,v)=>{
  cart[i].qty += v;
  if(cart[i].qty<=0) cart.splice(i,1);
  updateCart();
}

window.removeItem = i=>{
  cart.splice(i,1);
  updateCart();
}

// ORDER
window.bestellen = async function() {
  const name = document.getElementById("name").value.trim();

  if (!name) {
    alert("Bitte Namen eingeben!");
    return;
  }

  if (cart.length === 0) {
    alert("Warenkorb ist leer!");
    return;
  }

  await addDoc(collection(db, "orders"), {
    name,
    cart,
    time: serverTimestamp()
  });

  alert("Bestellung gespeichert!");
  cart = [];
  updateCart();
}

displayProducts();

</script>

</body>
</html>
