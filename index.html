<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Holzland Maradonas</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: radial-gradient(circle at top, #1a1a1a, #0a0a0a);
  color: white;
}

header {
  padding: 20px 40px;
  background: rgba(20,20,20,0.8);
}

.header-inner {
  display: flex;
  align-items: center;
  gap: 20px;
}

.logo-img { height: 110px; }
.logo { font-size: 36px; font-weight: 700; }

.container {
  padding: 30px;
  max-width: 1200px;
  margin: auto;
}

#name {
  padding: 18px;
  font-size: 18px;
  width: 320px;
  border-radius: 12px;
  border: none;
  margin-bottom: 20px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 25px;
}

.product {
  background: rgba(255,255,255,0.05);
  padding: 15px;
  border-radius: 18px;
  text-align: center;
}

.product img {
  width: 100%;
  border-radius: 14px;
}

.size-select {
  margin-top: 8px;
  padding: 8px;
  border-radius: 8px;
  border: none;
  background: #1c1c1c;
  color: white;
}

button {
  background: linear-gradient(135deg, #00c853, #00a844);
  border: none;
  color: white;
  padding: 8px;
  border-radius: 8px;
  margin: 3px;
  cursor: pointer;
}

.delete { background: red; }

/* CART */
#cart {
  margin-top: 30px;
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 18px;
}

.cart-item {
  margin-bottom: 10px;
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <img src="bilder/logo.jpg" class="logo-img">
    <div class="logo">Holzland Maradonas</div>
  </div>
</header>

<div class="container">

<input id="name" placeholder="Dein Name">

<div class="products" id="products"></div>

<div id="cart">
<h2>🛒 Warenkorb</h2>
<div id="cartList"></div>
<h3 id="total">Gesamt: 0 €</h3>
<button onclick="bestellen()">Bestellen</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSy...",
  authDomain: "onlineshop-maradonas.firebaseapp.com",
  projectId: "onlineshop-maradonas"
});

const db = getFirestore(app);

// PRODUKTE
const products = [
  {name:"Hoodie Rot", price:30, img:"bilder/hoodie_rot.png"},
  {name:"Hoodie Weinrot", price:30, img:"bilder/hoodie_weinrot.jpg"},
  {name:"Hoodie Grün", price:30, img:"bilder/hoodie_gruen.png"},
  {name:"Hoodie Schwarz", price:30, img:"bilder/hoodie_schwarz.png"},

  {name:"Pulli Rot", price:25, img:"bilder/pulli_rot.png"},
  {name:"Pulli Weinrot", price:25, img:"bilder/pulli_weinrot.png"},
  {name:"Pulli Grün", price:25, img:"bilder/pulli_gruen.png"},
  {name:"Pulli Schwarz", price:25, img:"bilder/pulli_schwarz.png"},

  {name:"T-Shirt Rot", price:20, img:"bilder/tshirt_rot.png"},
  {name:"T-Shirt Weinrot", price:20, img:"bilder/tshirt_weinrot.png"},
  {name:"T-Shirt Grün", price:20, img:"bilder/tshirt_gruen.png"},
  {name:"T-Shirt Schwarz", price:20, img:"bilder/tshirt_schwarz.png"},

  {name:"Polo Rot", price:20, img:"bilder/polo_rot.png"},
  {name:"Polo Grün", price:20, img:"bilder/polo_gruen.png"},
  {name:"Polo Schwarz", price:20, img:"bilder/polo_schwarz.png"},

  {name:"Mütze Weinrot", price:10, img:"bilder/muetze_weinrot.png"},
  {name:"Mütze Grün", price:10, img:"bilder/muetze_gruen.png"},
  {name:"Mütze Schwarz", price:10, img:"bilder/muetze_schwarz.png"}
];

let cart = [];

// PRODUKTE
function displayProducts() {
  const container = document.getElementById("products");

  products.forEach((p, index) => {
    const isHat = p.name.includes("Mütze");

    const div = document.createElement("div");
    div.className = "product";

    div.innerHTML = `
      <img src="${p.img}">
      <h3>${p.name}</h3>
      <p>${p.price} €</p>

      ${!isHat ? `
        <select id="size-${index}">
          <option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option>
        </select>
      ` : `<p>Einheitsgröße</p>`}

      <button onclick="addToCart(${index})">Hinzufügen</button>
    `;

    container.appendChild(div);
  });
}

// ADD
window.addToCart = function(index) {
  const p = products[index];
  const isHat = p.name.includes("Mütze");

  cart.push({
    name: p.name,
    size: isHat ? "Einheitsgröße" : document.getElementById(`size-${index}`).value,
    price: p.price,
    qty: 1
  });

  updateCart();
}

// CART UI
function updateCart() {
  const container = document.getElementById("cartList");
  container.innerHTML = "";

  let total = 0;

  cart.forEach((item, i) => {
    total += item.price * item.qty;

    let options = products.map(p =>
      `<option ${p.name===item.name?"selected":""}>${p.name}</option>`
    ).join("");

    container.innerHTML += `
      <div class="cart-item">

        <select onchange="changeProduct(${i}, this.value)">
          ${options}
        </select>

        ${item.name.includes("Mütze") ? 
          "Einheitsgröße" :
          `<select onchange="changeSize(${i}, this.value)">
            <option ${item.size=="S"?"selected":""}>S</option>
            <option ${item.size=="M"?"selected":""}>M</option>
            <option ${item.size=="L"?"selected":""}>L</option>
            <option ${item.size=="XL"?"selected":""}>XL</option>
            <option ${item.size=="XXL"?"selected":""}>XXL</option>
          </select>`
        }

        x${item.qty}

        <button onclick="changeQty(${i}, -1)">-</button>
        <button onclick="changeQty(${i}, 1)">+</button>
        <button class="delete" onclick="removeItem(${i})">❌</button>

      </div>
    `;
  });

  document.getElementById("total").textContent = "Gesamt: " + total + " €";
}

// CHANGE
window.changeQty = (i,v)=>{
  cart[i].qty += v;
  if(cart[i].qty<=0) cart.splice(i,1);
  updateCart();
}

window.removeItem = i=>{
  cart.splice(i,1);
  updateCart();
}

window.changeSize = (i,size)=>{
  cart[i].size = size;
}

window.changeProduct = (i,name)=>{
  const p = products.find(p=>p.name===name);
  cart[i].name = p.name;
  cart[i].price = p.price;
  updateCart();
}

// ORDER
window.bestellen = async function() {
  const name = document.getElementById("name").value;

  if (!name || cart.length === 0) return alert("Fehler!");

  await addDoc(collection(db, "orders"), {
    name,
    cart,
    time: serverTimestamp()
  });

  alert("Bestellung gespeichert!");
  cart = [];
  updateCart();
}

displayProducts();

</script>

</body>
</html>
