<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Admin - Holzland Maradonas</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
  margin: 0;
}

header {
  padding: 20px;
  background: black;
  text-align: center;
  font-size: 26px;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.card {
  background: #1c1c1c;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 12px;
}

.name {
  color: #00c853;
  font-weight: bold;
  margin-bottom: 10px;
}

.item {
  display: flex;
  gap: 8px;
  margin: 6px 0;
  flex-wrap: wrap;
}

button {
  padding: 8px 12px;
  border: none;
  cursor: pointer;
  border-radius: 6px;
  font-weight: bold;
}

.print { background: #2979ff; color: white; }
.export { background: #ffab00; color: black; }
.delete { background: red; color: white; }
.save { background: #00c853; color: white; }

input, select {
  padding: 6px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: #1c1c1c;
  border-radius: 12px;
  overflow: hidden;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #333;
  text-align: center;
}

th {
  background: #111;
  color: #00c853;
}

td:first-child, th:first-child {
  text-align: left;
}
</style>
</head>

<body>

<header>📊 Admin Panel - Holzland Maradonas</header>

<div class="container">

<div class="actions">
  <button class="print" onclick="printSummary()">🖨️ Zusammenfassung drucken</button>
  <button class="print" onclick="printOrders()">🖨️ Einzelbestellungen drucken</button>
  <button class="export" onclick="exportCSV()">📥 CSV / Excel exportieren</button>
</div>

<div id="app">⏳ Lade...</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCoLq0oP8U8Ag1qXHl_pr7oixDrAy7r8gQ",
  authDomain: "onlineshop-maradonas.firebaseapp.com",
  projectId: "onlineshop-maradonas",
  storageBucket: "onlineshop-maradonas.firebasestorage.app",
  messagingSenderId: "491142033512",
  appId: "1:491142033512:web:f79e5db730349e9471cbdd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container = document.getElementById("app");

let orders = [];
let stats = {};

const sizes = ["S", "M", "L", "XL", "XXL", "Einheitsgröße"];

function buildStats() {
  stats = {};

  orders.forEach(order => {
    order.cart.forEach(item => {
      const name = item.name || item.text || "Unbekannt";
      const size = item.size || "Einheitsgröße";
      const qty = Number(item.qty || 1);

      if (!stats[name]) stats[name] = {};
      stats[name][size] = (stats[name][size] || 0) + qty;
    });
  });
}

async function load() {
  try {
    const snapshot = await getDocs(collection(db, "orders"));

    orders = [];

    snapshot.forEach(d => {
      orders.push({
        id: d.id,
        ...d.data()
      });
    });

    buildStats();
    render();

  } catch (error) {
    container.innerHTML = `
      <h2>❌ Fehler beim Laden</h2>
      <p>${error.message}</p>
    `;
  }
}

function render() {
  container.innerHTML = "";
  renderOrders();
  renderStats();
}

function renderOrders() {
  const section = document.createElement("div");
  section.id = "ordersSection";
  section.innerHTML = "<h2>📦 Einzelbestellungen bearbeiten</h2>";

  orders.forEach((order, orderIndex) => {
    const div = document.createElement("div");
    div.className = "card";

    let html = `
      <div class="name">👤 Name:</div>
      <input value="${order.name || ""}" onchange="editOrderName(${orderIndex}, this.value)">
      <br><br>
    `;

    order.cart.forEach((item, itemIndex) => {
      html += `
        <div class="item">
          <input value="${item.name || item.text || ""}"
            onchange="editItem(${orderIndex}, ${itemIndex}, 'name', this.value)">

          <select onchange="editItem(${orderIndex}, ${itemIndex}, 'size', this.value)">
            ${sizes.map(s => `<option ${item.size === s ? "selected" : ""}>${s}</option>`).join("")}
          </select>

          <input type="number" min="1" value="${item.qty || 1}"
            onchange="editItem(${orderIndex}, ${itemIndex}, 'qty', this.value)">

          <input type="number" min="0" value="${item.price || 0}"
            onchange="editItem(${orderIndex}, ${itemIndex}, 'price', this.value)">

          <button class="delete" onclick="removeItem(${orderIndex}, ${itemIndex})">Artikel löschen</button>
        </div>
      `;
    });

    html += `
      <br>
      <button class="save" onclick="saveOrder(${orderIndex})">💾 Bestellung speichern</button>
      <button class="delete" onclick="deleteOrder(${orderIndex})">🗑️ Bestellung löschen</button>
    `;

    div.innerHTML = html;
    section.appendChild(div);
  });

  container.appendChild(section);
}

function renderStats() {
  const section = document.createElement("div");
  section.id = "summarySection";
  section.innerHTML = "<h2>📊 Zusammenfassung nach Produkten</h2>";

  let html = `
    <table>
      <tr>
        <th>Produkt</th>
        <th>S</th>
        <th>M</th>
        <th>L</th>
        <th>XL</th>
        <th>XXL</th>
        <th>Einheitsgröße</th>
        <th>Gesamt</th>
      </tr>
  `;

  Object.keys(stats).sort().forEach(product => {
    let total = 0;

    const row = sizes.map(size => {
      const amount = stats[product][size] || 0;
      total += amount;
      return `<td>${amount || ""}</td>`;
    }).join("");

    html += `
      <tr>
        <td><b>${product}</b></td>
        ${row}
        <td><b>${total}</b></td>
      </tr>
    `;
  });

  html += "</table>";
  section.innerHTML += html;
  container.appendChild(section);
}

window.editOrderName = function(orderIndex, value) {
  orders[orderIndex].name = value;
}

window.editItem = function(orderIndex, itemIndex, field, value) {
  if (field === "qty" || field === "price") {
    orders[orderIndex].cart[itemIndex][field] = Number(value);
  } else {
    orders[orderIndex].cart[itemIndex][field] = value;
  }

  buildStats();
  render();
}

window.removeItem = function(orderIndex, itemIndex) {
  orders[orderIndex].cart.splice(itemIndex, 1);
  buildStats();
  render();
}

window.saveOrder = async function(orderIndex) {
  const order = orders[orderIndex];

  await updateDoc(doc(db, "orders", order.id), {
    name: order.name,
    cart: order.cart
  });

  alert("Bestellung gespeichert!");
}

window.deleteOrder = async function(orderIndex) {
  if (!confirm("Diese Bestellung wirklich löschen?")) return;

  const order = orders[orderIndex];

  await deleteDoc(doc(db, "orders", order.id));

  orders.splice(orderIndex, 1);
  buildStats();
  render();
}

window.printSummary = function() {
  const content = document.getElementById("summarySection").innerHTML;
  openPrintWindow("Zusammenfassung", content);
}

window.printOrders = function() {
  let content = "<h2>📦 Einzelbestellungen</h2>";

  orders.forEach(order => {
    content += `
      <div class="print-card">
        <h3>👤 ${order.name || "Ohne Name"}</h3>
        <ul>
    `;

    order.cart.forEach(item => {
      const name = item.name || item.text || "Unbekannt";
      const size = item.size || "Einheitsgröße";
      const qty = item.qty || 1;
      const price = item.price || 0;

      content += `<li>${name} (${size}) x${qty} - ${price} €</li>`;
    });

    content += `
        </ul>
      </div>
    `;
  });

  openPrintWindow("Einzelbestellungen", content);
}

function openPrintWindow(title, content) {
  const win = window.open("", "_blank");

  win.document.write(`
    <html>
    <head>
      <title>${title}</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          padding: 20px;
          color: black;
        }

        h2 {
          margin-top: 0;
        }

        .print-card {
          border: 1px solid #999;
          padding: 12px;
          margin-bottom: 12px;
          border-radius: 8px;
          page-break-inside: avoid;
        }

        ul {
          margin-top: 8px;
        }

        li {
          margin-bottom: 4px;
        }

        table {
          width: 100%;
          border-collapse: collapse;
        }

        th, td {
          border: 1px solid #999;
          padding: 8px;
          text-align: center;
        }

        th {
          background: #eee;
        }

        td:first-child, th:first-child {
          text-align: left;
        }
      </style>
    </head>
    <body>
      ${content}
      <script>
        window.print();
      <\/script>
    </body>
    </html>
  `);

  win.document.close();
}

window.exportCSV = function() {
  let csv = "Produkt;S;M;L;XL;XXL;Einheitsgröße;Gesamt\n";

  Object.keys(stats).sort().forEach(product => {
    let total = 0;

    const values = sizes.map(size => {
      const amount = stats[product][size] || 0;
      total += amount;
      return amount;
    });

    csv += `${product};${values.join(";")};${total}\n`;
  });

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = "holzland-maradonas-zusammenfassung.csv";
  link.click();

  URL.revokeObjectURL(url);
}

load();

</script>

</body>
</html>
