<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Admin - Holzland Maradonas</title>

<style>
body {
  font-family: Arial;
  background: #0f0f0f;
  color: white;
  margin: 0;
}

header {
  background: black;
  padding: 20px;
  text-align: center;
  font-size: 26px;
}

.container {
  padding: 20px;
  max-width: 1100px;
  margin: auto;
}

.card {
  background: #1c1c1c;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 12px;
}

button {
  margin: 3px;
  padding: 5px 8px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.delete { background: red; color: white; }
.save { background: #00c853; color: white; }

input {
  padding: 5px;
  margin: 3px;
}
</style>

</head>
<body>

<header>📊 Admin Panel</header>
<div class="container" id="content">Lade...</div>

<script type="module">

const pw = prompt("Admin Passwort:");
if (pw !== "holz123") {
  document.body.innerHTML = "Kein Zugriff";
  throw new Error();
}

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  updateDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIza...",
  authDomain: "onlineshop-maradonas.firebaseapp.com",
  projectId: "onlineshop-maradonas",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container = document.getElementById("content");

// 🔥 LADEN
async function load() {
  const snapshot = await getDocs(collection(db, "orders"));
  container.innerHTML = "";

  snapshot.forEach(d => {
    const data = d.data();
    const id = d.id; // 🔥 WICHTIG

    const div = document.createElement("div");
    div.className = "card";

    let itemsHTML = "";

    data.cart.forEach((item, index) => {
      itemsHTML += `
        <div>
          <input value="${item.name}" id="name-${id}-${index}">
          <input value="${item.size}" id="size-${id}-${index}">
          <input value="${item.qty}" type="number" id="qty-${id}-${index}">
        </div>
      `;
    });

    div.innerHTML = `
      <h3>${data.name}</h3>
      ${itemsHTML}
      <button class="save" onclick="save('${id}', ${data.cart.length})">💾 Speichern</button>
      <button class="delete" onclick="del('${id}')">❌ Löschen</button>
    `;

    container.appendChild(div);
  });
}

// 🔥 LÖSCHEN
window.del = async function(id) {
  if (!confirm("Wirklich löschen?")) return;
  await deleteDoc(doc(db, "orders", id));
  load();
}

// 🔥 SPEICHERN
window.save = async function(id, length) {
  const newCart = [];

  for (let i = 0; i < length; i++) {
    const name = document.getElementById(`name-${id}-${i}`).value;
    const size = document.getElementById(`size-${id}-${i}`).value;
    const qty = parseInt(document.getElementById(`qty-${id}-${i}`).value);

    newCart.push({ name, size, qty });
  }

  await updateDoc(doc(db, "orders", id), {
    cart: newCart
  });

  alert("Gespeichert!");
  load();
}

load();

</script>

</body>
</html>
