<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Admin - Holzland Maradonas</title>

<style>
body {
  font-family: Arial;
  background: #0f0f0f;
  color: white;
  margin: 0;
}

header {
  background: black;
  padding: 20px;
  text-align: center;
  font-size: 26px;
  font-weight: bold;
}

.container {
  padding: 20px;
  max-width: 1000px;
  margin: auto;
}

h2 {
  margin-top: 20px;
}

.card {
  background: #1c1c1c;
  padding: 15px;
  margin-bottom: 12px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}

</style>

</head>
<body>

<header>📊 Admin Panel - Holzland Maradonas</header>

<div class="container" id="content">
  <p>⏳ Lade Bestellungen...</p>
</div>

<script type="module">

// 🔐 ADMIN SCHUTZ
const pw = prompt("Admin Passwort:");
if (pw !== "holz123") {
  document.body.innerHTML = "<h1>Zugriff verweigert</h1>";
  throw new Error("blocked");
}

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCoLq0oP8U8Ag1qXHl_pr7oixDrAy7r8gQ",
  authDomain: "onlineshop-maradonas.firebaseapp.com",
  projectId: "onlineshop-maradonas",
  storageBucket: "onlineshop-maradonas.firebasestorage.app",
  messagingSenderId: "491142033512",
  appId: "1:491142033512:web:f79e5db730349e9471cbdd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const container = document.getElementById("content");

// 📊 Statistik-Objekt
const stats = {};

function add(name, size) {
  if (!stats[name]) stats[name] = {};
  const s = size || "Einheitsgröße";
  stats[name][s] = (stats[name][s] || 0) + 1;
}

// 📦 Daten laden
async function load() {
  const snapshot = await getDocs(collection(db, "orders"));

  container.innerHTML = "";

  if (snapshot.empty) {
    container.innerHTML = "<p>Keine Bestellungen vorhanden.</p>";
    return;
  }

  snapshot.forEach(doc => {
    const data = doc.data();

    data.cart.forEach(item => {
      const match = item.text.match(/(.+)\((.+)\)/);

      let name = item.text;
      let size = "Einheitsgröße";

      if (match) {
        name = match[1].trim();
        size = match[2].trim();
      }

      add(name, size);
    });
  });

  render();
}

// 📊 Anzeige
function render() {
  container.innerHTML = "<h2>📦 Auswertung</h2>";

  for (let product in stats) {
    let total = 0;
    let sizeText = "";

    for (let size in stats[product]) {
      total += stats[product][size];
      sizeText += `<div>• ${size}: ${stats[product][size]}x</div>`;
    }

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${product}</b><br>
      Gesamt: ${total}x<br><br>
      ${sizeText}
    `;

    container.appendChild(div);
  }
}

load();

</script>

</body>
</html>
