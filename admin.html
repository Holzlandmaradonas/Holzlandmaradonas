<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Admin - Holzland Maradonas</title>

<style>
body {
  font-family: Arial;
  background: #0f0f0f;
  color: white;
  margin: 0;
}

header {
  padding: 20px;
  background: black;
  text-align: center;
  font-size: 26px;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.card, .stat {
  background: #1c1c1c;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 12px;
}

.name {
  color: #00c853;
  font-weight: bold;
  margin-bottom: 10px;
}

.item {
  display: flex;
  gap: 8px;
  margin: 5px 0;
  flex-wrap: wrap;
}

button {
  padding: 5px 10px;
  border: none;
  cursor: pointer;
  border-radius: 6px;
}

.delete { background: red; }
.save { background: #00c853; }

input, select {
  padding: 5px;
}
</style>
</head>

<body>

<header>📊 Admin Panel</header>

<div class="container" id="app">⏳ Lade...</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSy...",
  authDomain: "onlineshop-maradonas.firebaseapp.com",
  projectId: "onlineshop-maradonas"
});

const db = getFirestore(app);

const container = document.getElementById("app");

let orders = [];
let stats = {};

// 📊 STATISTIK NEU BERECHNEN
function buildStats() {
  stats = {};

  orders.forEach(o => {
    o.cart.forEach(i => {
      const key = `${i.name} (${i.size})`;
      stats[key] = (stats[key] || 0) + Number(i.qty);
    });
  });
}

// 📦 LADEN
async function load() {
  const snapshot = await getDocs(collection(db, "orders"));

  orders = [];

  snapshot.forEach(d => {
    orders.push({
      id: d.id,
      ...d.data()
    });
  });

  buildStats();
  render();
}

// 🔥 UI
function render() {
  container.innerHTML = "";

  // 📦 BESTELLUNGEN
  const orderSection = document.createElement("div");
  orderSection.innerHTML = "<h2>📦 Bestellungen</h2>";

  orders.forEach((o, oi) => {

    const div = document.createElement("div");
    div.className = "card";

    let html = `<div class="name">👤 ${o.name}</div>`;

    o.cart.forEach((i, ii) => {
      html += `
        <div class="item">

          <input value="${i.name}"
            onchange="edit(${oi},${ii},'name',this.value)">

          <select onchange="edit(${oi},${ii},'size',this.value)">
            <option ${i.size=="S"?"selected":""}>S</option>
            <option ${i.size=="M"?"selected":""}>M</option>
            <option ${i.size=="L"?"selected":""}>L</option>
            <option ${i.size=="XL"?"selected":""}>XL</option>
            <option ${i.size=="XXL"?"selected":""}>XXL</option>
            <option ${i.size=="Einheitsgröße"?"selected":""}>Einheitsgröße</option>
          </select>

          <input type="number" min="1" value="${i.qty}"
            onchange="edit(${oi},${ii},'qty',this.value)">

          <button class="delete" onclick="removeItem(${oi},${ii})">❌</button>

        </div>
      `;
    });

    html += `<button class="save" onclick="save(${oi})">💾 Speichern</button>`;

    div.innerHTML = html;
    orderSection.appendChild(div);
  });

  // 📊 STATISTIK
  const statSection = document.createElement("div");
  statSection.innerHTML = "<h2>📊 Statistik</h2>";

  Object.keys(stats).forEach(k => {
    const div = document.createElement("div");
    div.className = "stat";
    div.textContent = `${k}: ${stats[k]}x`;
    statSection.appendChild(div);
  });

  container.appendChild(orderSection);
  container.appendChild(statSection);
}

// ✏️ EDIT
window.edit = function(oi, ii, field, value) {
  orders[oi].cart[ii][field] =
    field === "qty" ? Number(value) : value;
}

// ❌ DELETE ITEM
window.removeItem = function(oi, ii) {
  orders[oi].cart.splice(ii, 1);
  buildStats();
  render();
}

// 💾 SAVE
window.save = async function(index) {
  const ref = doc(db, "orders", orders[index].id);

  await updateDoc(ref, {
    cart: orders[index].cart
  });

  alert("Gespeichert!");
}

load();

</script>

</body>
</html>
