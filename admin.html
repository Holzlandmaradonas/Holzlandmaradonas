<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Admin - Holzland Maradonas</title>

<style>
body {
  font-family: Arial;
  background: #0f0f0f;
  color: white;
  margin: 0;
}

header {
  padding: 20px;
  background: black;
  text-align: center;
  font-size: 26px;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #1c1c1c;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 12px;
}

.name {
  color: #00c853;
  font-weight: bold;
}

.item {
  display: flex;
  gap: 10px;
  align-items: center;
  margin: 5px 0;
}

button {
  padding: 5px 10px;
  border: none;
  cursor: pointer;
  border-radius: 6px;
}

.edit { background: orange; }
.save { background: #00c853; }
.delete { background: red; }

input, select {
  padding: 5px;
}
</style>
</head>

<body>

<header>📊 Admin - Bestellungen</header>

<div class="container" id="app">⏳ Lade...</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSy...",
  authDomain: "onlineshop-maradonas.firebaseapp.com",
  projectId: "onlineshop-maradonas"
});

const db = getFirestore(app);

const container = document.getElementById("app");

let orders = [];

async function load() {
  const snapshot = await getDocs(collection(db, "orders"));

  container.innerHTML = "";

  snapshot.forEach(docSnap => {
    orders.push({
      id: docSnap.id,
      ...docSnap.data()
    });
  });

  render();
}

function render() {
  container.innerHTML = "<h2>📦 Bestellungen</h2>";

  orders.forEach((o, orderIndex) => {

    const div = document.createElement("div");
    div.className = "card";

    let html = `<div class="name">👤 ${o.name}</div>`;

    o.cart.forEach((item, i) => {
      html += `
        <div class="item">

          <input value="${item.name}" onchange="editItem(${orderIndex},${i},'name',this.value)">
          
          <select onchange="editItem(${orderIndex},${i},'size',this.value)">
            <option ${item.size=="S"?"selected":""}>S</option>
            <option ${item.size=="M"?"selected":""}>M</option>
            <option ${item.size=="L"?"selected":""}>L</option>
            <option ${item.size=="XL"?"selected":""}>XL</option>
            <option ${item.size=="XXL"?"selected":""}>XXL</option>
            <option ${item.size=="Einheitsgröße"?"selected":""}>Einheitsgröße</option>
          </select>

          <input type="number" value="${item.qty}" min="1"
            onchange="editItem(${orderIndex},${i},'qty',this.value)">

          <button class="delete" onclick="removeItem(${orderIndex},${i})">❌</button>

        </div>
      `;
    });

    html += `
      <button class="save" onclick="saveOrder(${orderIndex})">💾 Speichern</button>
    `;

    div.innerHTML = html;
    container.appendChild(div);
  });
}

// EDIT
window.editItem = function(oIndex, iIndex, field, value) {
  orders[oIndex].cart[iIndex][field] = value;

  if(field === "qty") {
    orders[oIndex].cart[iIndex][field] = parseInt(value);
  }
}

// DELETE ITEM
window.removeItem = function(oIndex, iIndex) {
  orders[oIndex].cart.splice(iIndex, 1);
  render();
}

// SAVE
window.saveOrder = async function(index) {
  const order = orders[index];

  const ref = doc(db, "orders", order.id);

  await updateDoc(ref, {
    cart: order.cart
  });

  alert("Gespeichert!");
}

load();

</script>

</body>
</html>
