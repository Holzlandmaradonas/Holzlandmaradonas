<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Admin - Holzland Maradonas</title>

<style>
body {
  font-family: Arial;
  background: #0f0f0f;
  color: white;
  margin: 0;
}

header {
  padding: 20px;
  background: black;
  text-align: center;
  font-size: 26px;
  font-weight: bold;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #1c1c1c;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 12px;
}

.name {
  color: #00c853;
  font-weight: bold;
  font-size: 18px;
}

.item {
  margin-left: 10px;
}

.stat {
  background: #222;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>📊 Admin Panel</header>

<div class="container" id="app">
⏳ Lade Daten...
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSy...",
  authDomain: "onlineshop-maradonas.firebaseapp.com",
  projectId: "onlineshop-maradonas"
});

const db = getFirestore(app);

const container = document.getElementById("app");

let stats = {};
let orders = [];

function addStat(item) {
  const key = `${item.name} (${item.size})`;

  if (!stats[key]) {
    stats[key] = 0;
  }

  stats[key] += item.qty;
}

async function load() {
  const snapshot = await getDocs(collection(db, "orders"));

  container.innerHTML = "";

  if (snapshot.empty) {
    container.innerHTML = "<p>Keine Bestellungen</p>";
    return;
  }

  snapshot.forEach(doc => {
    const data = doc.data();
    orders.push(data);

    data.cart.forEach(addStat);
  });

  render();
}

function render() {

  // 📦 BESTELLUNGEN
  const orderDiv = document.createElement("div");

  orderDiv.innerHTML = "<h2>📦 Bestellungen</h2>";

  orders.forEach(o => {
    const div = document.createElement("div");
    div.className = "card";

    let html = `<div class="name">👤 ${o.name}</div>`;

    o.cart.forEach(i => {
      html += `<div class="item">🛒 ${i.name} (${i.size}) x${i.qty}</div>`;
    });

    div.innerHTML = html;
    orderDiv.appendChild(div);
  });

  // 📊 STATISTIK
  const statDiv = document.createElement("div");

  statDiv.innerHTML = "<h2>📊 Statistik</h2>";

  Object.keys(stats).forEach(key => {
    const div = document.createElement("div");
    div.className = "stat";
    div.textContent = `${key}: ${stats[key]}x`;
    statDiv.appendChild(div);
  });

  container.appendChild(orderDiv);
  container.appendChild(statDiv);
}

load();

</script>

</body>
</html>
